<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watchlist Randomizer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='30' cy='50' r='12' fill='%23ff8000'/><circle cx='50' cy='50' r='12' fill='%2300e054'/><circle cx='70' cy='50' r='12' fill='%2340bcf4'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: #0E1115;
      color: #C9C2B5;
      -webkit-font-smoothing: antialiased;
    }

    /* Buttons used by ResultCard */
    .lr-btn {
      appearance: none; cursor: default;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 18px;
      font-size: 12.5px; font-weight: 500; letter-spacing: 0.04em;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: transparent;
      color: inherit;
      font-family: inherit;
      transition: all .18s ease;
    }
    .lr-btn:hover { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.22); }
    .lr-btn-primary {
      background: var(--accent, #E8B947);
      color: var(--accent-text, #1A1408);
      border-color: transparent;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }
    .lr-btn-primary:hover { filter: brightness(1.08); background: var(--accent, #E8B947); }
    .lr-btn-active {
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.25);
      color: #fff;
    }
    .lr-btn-ghost { /* default look already applied */ }

    @keyframes lr-spin { to { transform: rotate(360deg); } }
    @keyframes lr-pop {
      0%   { transform: scale(0.85); opacity: 0; }
      60%  { transform: scale(1.04); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes lr-fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    ::selection { background: rgba(232,185,71,.3); color: #fff; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="poster.jsx"></script>
  <script type="text/babel" src="filter-rail.jsx"></script>
  <script type="text/babel" src="spin-reel.jsx"></script>
  <script type="text/babel" src="result-card.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
  <script type="text/babel">
    // Mount after all babel scripts have run
    (function mount() {
      if (!window.App) { return setTimeout(mount, 30); }
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    })();
  </script>
</body>
</html>
