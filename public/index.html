<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letterboxd Random</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='30' cy='50' r='12' fill='%23ff8000'/><circle cx='50' cy='50' r='12' fill='%2300e054'/><circle cx='70' cy='50' r='12' fill='%2340bcf4'/></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #14181c;
            min-height: 100vh;
            color: #99aabb;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        /* Letterboxd Logo - Three Dots */
        .logo {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .logo-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        .logo-dot.orange { background: #ff8000; }
        .logo-dot.green { background: #00e054; }
        .logo-dot.blue { background: #40bcf4; }

        h1 {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: #678;
            font-size: 0.95rem;
            margin-bottom: 32px;
        }

        .input-wrapper {
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            align-items: center;
            background: #2c3440;
            border-radius: 4px;
            border: 1px solid #456;
            transition: border-color 0.2s;
        }

        .input-group:focus-within {
            border-color: #00e054;
        }

        .prefix {
            color: #678;
            font-size: 0.9rem;
            padding: 12px;
            padding-right: 0;
            white-space: nowrap;
            user-select: none;
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 0.95rem;
            padding: 12px;
            padding-left: 4px;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: #556;
        }

        .btn {
            background: #00e054;
            color: #14181c;
            border: none;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .btn:hover {
            background: #00c848;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #456;
            color: #789;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 40px;
            display: none;
        }

        .result.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .poster-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .poster {
            width: 230px;
            height: 345px;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .poster:hover {
            border-color: #00e054;
            box-shadow: 0 0 20px rgba(0, 224, 84, 0.3);
            transform: scale(1.02);
        }

        .no-poster {
            width: 230px;
            height: 345px;
            background: #2c3440;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #567;
            font-size: 0.9rem;
        }

        .movie-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #fff;
        }

        .movie-year {
            color: #678;
            font-size: 1rem;
            margin-bottom: 16px;
        }

        .movie-link {
            display: inline-block;
            color: #40bcf4;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 24px;
            transition: color 0.2s;
        }

        .movie-link:hover {
            color: #fff;
        }

        .btn-secondary {
            background: #456;
            color: #fff;
            margin-top: 8px;
        }

        .btn-secondary:hover {
            background: #567;
        }

        .error {
            background: rgba(255, 80, 80, 0.1);
            border: 1px solid #e54b4b;
            color: #ff8080;
            padding: 14px;
            border-radius: 4px;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .error a {
            color: #40bcf4;
        }

        .loading {
            color: #99aabb;
            margin-top: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #456;
            border-top-color: #00e054;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .stats {
            color: #556;
            font-size: 0.8rem;
            margin-top: 16px;
        }

        footer {
            margin-top: auto;
            padding-top: 60px;
            color: #456;
            font-size: 0.75rem;
        }

        footer a {
            color: #567;
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: #00e054;
        }

        .genre-section {
            margin-bottom: 16px;
        }

        .wheel-container {
            position: relative;
            width: 300px;
            margin: 0 auto 12px;
        }

        .wheel-pointer {
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 9px solid transparent;
            border-right: 9px solid transparent;
            border-top: 16px solid #00e054;
            z-index: 10;
            filter: drop-shadow(0 0 5px rgba(0, 224, 84, 0.6));
        }

        #genreWheel {
            display: block;
            border-radius: 50%;
            cursor: pointer;
        }

        .spin-genre-btn {
            background: transparent;
            border: 1px solid #456;
            color: #99aabb;
            font-size: 0.85rem;
            padding: 6px 20px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            display: block;
            margin: 0 auto;
        }

        .spin-genre-btn:hover {
            border-color: #00e054;
            color: #00e054;
        }

        .spin-genre-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 30px 16px;
            }

            h1 {
                font-size: 1.3rem;
            }

            .poster, .no-poster {
                width: 200px;
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Letterboxd Logo -->
        <div class="logo">
            <div class="logo-dot orange"></div>
            <div class="logo-dot green"></div>
            <div class="logo-dot blue"></div>
        </div>

        <h1>Watchlist Randomizer</h1>
        <p class="subtitle">Pick a random movie from your Letterboxd watchlist</p>

        <div class="input-wrapper">
            <div class="input-group">
                <span class="prefix">letterboxd.com/</span>
                <input type="text" id="username" placeholder="username" autocomplete="off" autocapitalize="off" spellcheck="false">
            </div>
        </div>

        <div class="genre-section">
            <div class="wheel-container">
                <div class="wheel-pointer"></div>
                <canvas id="genreWheel"></canvas>
            </div>
            <button class="spin-genre-btn" id="spinGenreBtn" onclick="spinGenre()">&#x27F3; Spin</button>
        </div>

        <button class="btn" id="pickBtn" onclick="fetchWatchlist()">Pick Random Movie</button>

        <div id="loading" class="loading" style="display: none;">
            <span class="spinner"></span>
            <span>Fetching watchlist...</span>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="result" class="result">
            <div class="poster-wrapper">
                <img id="poster" class="poster" src="" alt="Movie poster">
                <div id="noPoster" class="no-poster" style="display: none;">No poster available</div>
            </div>
            <h2 id="movieTitle" class="movie-title"></h2>
            <p id="movieYear" class="movie-year"></p>
            <a id="movieLink" class="movie-link" href="#" target="_blank">View on Letterboxd →</a>
            <br>
            <button class="btn btn-secondary" onclick="pickAnother()">Pick Another</button>
            <p id="stats" class="stats"></p>
        </div>
    </div>

    <footer>
        Powered by <a href="https://letterboxd.com" target="_blank">Letterboxd</a>
    </footer>

    <script>
        let cachedMovies = [];
        let currentUsername = '';
        let useAPI = false;
        let selectedGenre = null;

        const genres = [
            { name: 'Action',      slug: 'action',          color: '#e74c3c' },
            { name: 'Adventure',   slug: 'adventure',       color: '#27ae60' },
            { name: 'Animation',   slug: 'animation',       color: '#1abc9c' },
            { name: 'Comedy',      slug: 'comedy',          color: '#f1c40f' },
            { name: 'Crime',       slug: 'crime',           color: '#7f8c8d' },
            { name: 'Documentary', slug: 'documentary',     color: '#3498db' },
            { name: 'Drama',       slug: 'drama',           color: '#8e44ad' },
            { name: 'Fantasy',     slug: 'fantasy',         color: '#9b59b6' },
            { name: 'Horror',      slug: 'horror',          color: '#c0392b' },
            { name: 'Mystery',     slug: 'mystery',         color: '#2980b9' },
            { name: 'Romance',     slug: 'romance',         color: '#e91e8c' },
            { name: 'Sci-Fi',      slug: 'science-fiction', color: '#00bcd4' },
            { name: 'Thriller',    slug: 'thriller',        color: '#e67e22' },
        ];

        const usernameInput = document.getElementById('username');
        const pickBtn = document.getElementById('pickBtn');
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const resultEl = document.getElementById('result');

        // Enter key triggers fetch
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchWatchlist();
        });

        // --- Roulette Wheel ---
        const wheelCanvas = document.getElementById('genreWheel');
        const WHEEL_SIZE = 300;
        const SEG = (2 * Math.PI) / genres.length;
        let wheelAngle = -Math.PI / 2 - SEG / 2; // Segment 0 at top
        let spinning = false;

        // Hi-DPI canvas setup
        (function initCanvas() {
            const dpr = window.devicePixelRatio || 1;
            wheelCanvas.width = WHEEL_SIZE * dpr;
            wheelCanvas.height = WHEEL_SIZE * dpr;
            wheelCanvas.style.width = WHEEL_SIZE + 'px';
            wheelCanvas.style.height = WHEEL_SIZE + 'px';
            wheelCanvas.getContext('2d').scale(dpr, dpr);
        })();

        function hexDarken(hex, f) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`;
        }

        function drawWheel(angle) {
            const ctx = wheelCanvas.getContext('2d');
            const s = WHEEL_SIZE;
            const cx = s / 2, cy = s / 2;
            const r = s / 2 - 2;

            ctx.clearRect(0, 0, s, s);

            genres.forEach((g, i) => {
                const start = angle + i * SEG;
                const end = start + SEG;
                const isSelected = selectedGenre === g.slug;

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, start, end);
                ctx.closePath();
                ctx.fillStyle = selectedGenre && !isSelected ? hexDarken(g.color, 0.45) : g.color;
                ctx.fill();
                ctx.strokeStyle = '#0e1216';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // White arc highlight on selected segment
                if (isSelected) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(cx, cy, r - 5, start + 0.04, end - 0.04);
                    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.restore();
                }

                // Label
                const mid = start + SEG / 2;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(mid);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
                ctx.shadowColor = 'rgba(0,0,0,0.7)';
                ctx.shadowBlur = 3;
                ctx.fillText(g.name, r - 10, 4);
                ctx.restore();
            });

            // Outer border ring
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, 2 * Math.PI);
            ctx.strokeStyle = '#2c3440';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Center hub
            ctx.beginPath();
            ctx.arc(cx, cy, 18, 0, 2 * Math.PI);
            ctx.fillStyle = '#14181c';
            ctx.fill();
            ctx.strokeStyle = selectedGenre ? '#00e054' : '#456';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function selectGenre(slug) {
            selectedGenre = (selectedGenre === slug) ? null : slug;
            cachedMovies = [];
            currentUsername = '';
            drawWheel(wheelAngle);
        }

        function spinGenre() {
            if (spinning) return;
            spinning = true;

            const spinBtn = document.getElementById('spinGenreBtn');
            spinBtn.disabled = true;

            selectedGenre = null;
            cachedMovies = [];
            currentUsername = '';

            const targetIndex = Math.floor(Math.random() * genres.length);

            // Target wheelAngle: center of targetIndex segment lands at pointer (top = -π/2)
            // center of seg i = angle + i*SEG + SEG/2 = -π/2  →  angle = -π/2 - i*SEG - SEG/2
            const base = -Math.PI / 2 - targetIndex * SEG - SEG / 2;
            const minTarget = wheelAngle + 5 * 2 * Math.PI;
            const k = Math.ceil((minTarget - base) / (2 * Math.PI));
            const targetAngle = base + k * 2 * Math.PI;

            const startAngle = wheelAngle;
            const distance = targetAngle - startAngle;
            const duration = 4000;
            const startTime = performance.now();

            function animate(now) {
                const t = Math.min((now - startTime) / duration, 1);
                const eased = 1 - Math.pow(1 - t, 4); // ease-out quart
                wheelAngle = startAngle + distance * eased;
                drawWheel(wheelAngle);
                if (t < 1) {
                    requestAnimationFrame(animate);
                } else {
                    wheelAngle = targetAngle;
                    spinning = false;
                    spinBtn.disabled = false;
                    selectGenre(genres[targetIndex].slug);
                }
            }

            requestAnimationFrame(animate);
        }

        // Click a wheel segment to select it
        wheelCanvas.addEventListener('click', (e) => {
            if (spinning) return;
            const rect = wheelCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left - WHEEL_SIZE / 2;
            const y = e.clientY - rect.top - WHEEL_SIZE / 2;
            const dist = Math.sqrt(x * x + y * y);
            if (dist > WHEEL_SIZE / 2 - 2 || dist < 18) return;
            let clickAngle = ((Math.atan2(y, x) - wheelAngle) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
            selectGenre(genres[Math.floor(clickAngle / SEG) % genres.length].slug);
        });

        drawWheel(wheelAngle);

        async function fetchWatchlist() {
            const username = usernameInput.value.trim().toLowerCase();

            if (!username) {
                showError('Please enter a username');
                return;
            }

            // If same user+genre and we have cached data, just pick another
            const cacheKey = username + (selectedGenre || '');
            if (cacheKey === currentUsername && cachedMovies.length > 0) {
                pickAnother();
                return;
            }

            showLoading(true);
            hideError();
            hideResult();
            cachedMovies = [];
            currentUsername = cacheKey;

            try {
                // Try our own serverless API first (Cloudflare Workers)
                async function tryOwnAPI(user) {
                    try {
                        const genreParam = selectedGenre ? `&genre=${selectedGenre}` : '';
                        const response = await fetch(`/api/watchlist?username=${user}${genreParam}`);
                        if (response.ok) {
                            const data = await response.json();
                            if (data.movies && data.movies.length > 0) {
                                return { success: true, movies: data.movies };
                            }
                        }
                    } catch (e) {
                        // API not available
                    }
                    return null;
                }

                // Try watchlistpicker.com API as fallback
                async function tryWatchlistPickerAPI(user) {
                    try {
                        const response = await fetch(`https://watchlistpicker.com/api?users=${user}`);
                        if (response.ok) {
                            const text = await response.text();
                            if (!text.includes('error') && !text.includes('Union error')) {
                                const data = JSON.parse(text);
                                if (data && data.slug) {
                                    return { useExternalAPI: true, film: data };
                                }
                            }
                        }
                    } catch (e) {}
                    return null;
                }

                // Strategy 1: Try our own serverless API
                let result = await tryOwnAPI(username);

                // Strategy 2: Try watchlistpicker.com API
                if (!result) {
                    const wlpResult = await tryWatchlistPickerAPI(username);
                    if (wlpResult && wlpResult.useExternalAPI) {
                        const film = wlpResult.film;
                        cachedMovies.push({
                            slug: film.slug,
                            title: film.film_name || film.slug.replace(/-/g, ' '),
                            poster: film.image_url || '',
                            year: film.release_year || '',
                            link: `https://letterboxd.com/film/${film.slug}/`
                        });
                        useAPI = true;
                    }
                }

                // Use result if we got one
                if (result && result.movies) {
                    cachedMovies.push(...result.movies);
                }

                if (cachedMovies.length === 0) {
                    throw new Error('Could not fetch watchlist. User may not exist or watchlist is private.');
                }

                showLoading(false);
                pickAnother();

            } catch (err) {
                showLoading(false);
                showError(err.message);
                cachedMovies = [];
                currentUsername = '';
            }
        }

        async function pickAnother() {
            // If using external API mode (watchlistpicker.com), fetch a new random film
            if (useAPI && currentUsername) {
                showLoading(true);
                try {
                    const response = await fetch(`https://watchlistpicker.com/api?users=${currentUsername}`);
                    if (response.ok) {
                        const text = await response.text();
                        if (!text.includes('error')) {
                            const film = JSON.parse(text);
                            if (film && film.slug) {
                                cachedMovies = [{
                                    slug: film.slug,
                                    title: film.film_name || film.slug.replace(/-/g, ' '),
                                    poster: film.image_url || '',
                                    year: film.release_year || '',
                                    link: `https://letterboxd.com/film/${film.slug}/`
                                }];
                            }
                        }
                    }
                } catch (e) {}
                showLoading(false);
            }

            if (cachedMovies.length === 0) return;

            const randomIndex = Math.floor(Math.random() * cachedMovies.length);
            const movie = cachedMovies[randomIndex];

            document.getElementById('movieTitle').textContent = formatTitle(movie.title);
            document.getElementById('movieYear').textContent = movie.year || extractYear(movie.title);

            // Handle movie link - only show if we have a valid link
            const movieLinkEl = document.getElementById('movieLink');
            if (movie.link && movie.link.startsWith('https://letterboxd.com/film/')) {
                movieLinkEl.href = movie.link;
                movieLinkEl.style.display = 'inline-block';
            } else if (movie.slug) {
                // Construct link from slug if link is missing
                movieLinkEl.href = `https://letterboxd.com/film/${movie.slug}/`;
                movieLinkEl.style.display = 'inline-block';
            } else {
                movieLinkEl.style.display = 'none';
            }

            const posterImg = document.getElementById('poster');
            const noPoster = document.getElementById('noPoster');

            if (movie.poster && !movie.poster.includes('empty-poster')) {
                posterImg.src = movie.poster;
                posterImg.style.display = 'block';
                noPoster.style.display = 'none';
            } else {
                posterImg.style.display = 'none';
                noPoster.style.display = 'flex';
            }

            document.getElementById('stats').textContent = useAPI
                ? 'Powered by watchlistpicker.com'
                : `From ${cachedMovies.length} movies in watchlist`;
            showResult();
        }

        function formatTitle(title) {
            return title.replace(/\s*\(\d{4}\)\s*$/, '').trim() || title;
        }

        function extractYear(title) {
            const match = title.match(/\((\d{4})\)/);
            return match ? match[1] : '';
        }

        function showLoading(show) {
            loadingEl.style.display = show ? 'flex' : 'none';
            pickBtn.disabled = show;
        }

        function showError(message) {
            errorEl.innerHTML = message;
            errorEl.style.display = 'block';
        }

        function hideError() {
            errorEl.style.display = 'none';
        }

        function showResult() {
            resultEl.classList.add('show');
        }

        function hideResult() {
            resultEl.classList.remove('show');
        }
    </script>
</body>
</html>
